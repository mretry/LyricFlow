name: lyricflow
description: Offline audio/video player with tap-to-seek timed lyrics.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^13.2.0
  just_audio: ^0.10.6
  video_player: ^2.14.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  path: ^1.9.1
  http: ^1.3.0
  mobile_scanner: ^7.4.2
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

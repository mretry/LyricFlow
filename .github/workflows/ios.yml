name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Flutter 3.47.8
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          xcodebuild -version
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Build release for physical devices
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: bash scripts/package_unsigned_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: LyricFlow-unsigned-ios
          path: |
            build/ios/ipa/LyricFlow-unsigned.ipa
            build/ios/ipa/LyricFlow-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
